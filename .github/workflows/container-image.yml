name: Container image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .env
      - Dockerfile
      - entrypoint.sh
      - patches/**
      - .github/workflows/container-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read locked versions
        id: versions
        shell: bash
        run: |
          set -a
          source .env
          {
            echo "node=${NODE_VERSION}"
            echo "openclaw=${OPENCLAW_VERSION}"
            echo "clawhub=${CLAWHUB_VERSION}"
            echo "pptxgenjs=${PPTXGENJS_VERSION}"
            echo "playwright=${PLAYWRIGHT_VERSION}"
            echo "minimax_skills_ref=${MINIMAX_SKILLS_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dictxiong/claw-docker
          tags: |
            type=raw,value=${{ steps.versions.outputs.openclaw }}
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            OPENCLAW_VERSION=${{ steps.versions.outputs.openclaw }}
            CLAWHUB_VERSION=${{ steps.versions.outputs.clawhub }}
            PPTXGENJS_VERSION=${{ steps.versions.outputs.pptxgenjs }}
            PLAYWRIGHT_VERSION=${{ steps.versions.outputs.playwright }}
            MINIMAX_SKILLS_REF=${{ steps.versions.outputs.minimax_skills_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
