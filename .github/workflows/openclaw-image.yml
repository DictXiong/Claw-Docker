name: OpenClaw image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .env
      - images/openclaw/**
      - .github/workflows/openclaw-image.yml
  push:
    branches:
      - main
    paths:
      - .env
      - images/openclaw/**
      - .github/workflows/openclaw-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: openclaw-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read locked versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          : "${FLYAI_SKILL_REF:?FLYAI_SKILL_REF is required}"
          : "${MINIMAX_SKILLS_REF:?MINIMAX_SKILLS_REF is required}"
          openclaw="$(node -p "require('./images/openclaw/package.json').dependencies.openclaw")"
          {
            echo "openclaw=${openclaw}"
            echo "flyai_skill_ref=${FLYAI_SKILL_REF}"
            echo "minimax_skills_ref=${MINIMAX_SKILLS_REF}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: images/openclaw
          platforms: linux/amd64
          load: true
          tags: openclaw-smoke:${{ github.sha }}
          build-args: |
            FLYAI_SKILL_REF=${{ steps.versions.outputs.flyai_skill_ref }}
            MINIMAX_SKILLS_REF=${{ steps.versions.outputs.minimax_skills_ref }}
          cache-from: type=gha,scope=openclaw
          cache-to: type=gha,mode=max,scope=openclaw

      - name: Smoke test image
        run: images/openclaw/scripts/smoke-test.sh openclaw-smoke:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dictxiong/claw-docker
          tags: |
            type=raw,value=${{ steps.versions.outputs.openclaw }}-${{ github.sha }}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: images/openclaw
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            FLYAI_SKILL_REF=${{ steps.versions.outputs.flyai_skill_ref }}
            MINIMAX_SKILLS_REF=${{ steps.versions.outputs.minimax_skills_ref }}
          cache-from: type=gha,scope=openclaw
          provenance: mode=max
          sbom: true
