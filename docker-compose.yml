services:
  openclaw-jarvis:
    build:
      context: .
      args:
        CUDA_VERSION: "${CUDA_VERSION:-13.1.1}"
        NODE_VERSION: "${NODE_VERSION:-24.15.0}"
        OPENCLAW_VERSION: "${OPENCLAW_VERSION:-2026.7.1-2}"
        CLAWHUB_VERSION: "${CLAWHUB_VERSION:-0.23.1}"
        PPTXGENJS_VERSION: "${PPTXGENJS_VERSION:-4.0.1}"
        PLAYWRIGHT_VERSION: "${PLAYWRIGHT_VERSION:-1.61.0}"
        MINIMAX_SKILLS_REF: "${MINIMAX_SKILLS_REF:-60aaae52bb2af8162732751a4332f62a5fef518b}"
    image: "openclaw-jarvis:${OPENCLAW_VERSION:-2026.7.1-2}-cu${CUDA_VERSION:-13.1.1}"
    container_name: openclaw-jarvis
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    volumes:
      - type: bind
        source: /data0/opt/claw/jarvis/.openclaw
        target: /home/node/.openclaw
        bind:
          create_host_path: false
      - type: bind
        source: /data0/opt/claw/shared
        target: /home/node/.openclaw/workspace/shared-readonly
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /tank1/entity.backup1/OneDrive
        target: /home/node/.openclaw/workspace/onedrive-readonly
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
    dns:
      - "10.91.0.69"
      - "1.0.0.1"
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      HOME: /home/node
      OPENCLAW_HOME: /home/node/.openclaw
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_SERVICE_REPAIR_POLICY: external
      XDG_CACHE_HOME: /home/node/.cache
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    devices:
      - nvidia.com/gpu=all
